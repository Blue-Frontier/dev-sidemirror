name: Status check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Record a health sample
        env:
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
        run: |
          urls="https://dev-sidemirror.bestar.de5.net/api/health?record=1
          https://dev-sidemirror.pages.dev/api/health?record=1"

          for url in $urls; do
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                -H "x-status-token: $STATUS_TOKEN" "$url" || true)
              echo "$url attempt $attempt: HTTP $code"
              if [ "$code" = "200" ]; then
                exit 0
              fi
              if [ "$attempt" = "1" ]; then
                curl -sS -o /dev/null -D - --max-time 30 -H "x-status-token: $STATUS_TOKEN" "$url" | head -n 20 || true
              fi
              sleep 5
            done
          done

          echo "failed to record a health sample"
          exit 1
